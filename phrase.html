<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>申辦片語產生器</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: -apple-system, "Helvetica Neue", sans-serif; background-color: #f0f4f3; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #1DB446; margin-bottom: 20px; font-size: 22px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; color: #666; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; transition: border 0.3s; background: white; }
        input:focus, select:focus { border-color: #1DB446; outline: none; }
        input.auto-filled { border-color: #1DB446; background-color: #f0fff4; }
        input.readonly-filled { border-color: #1DB446; background-color: #f0fff4; color: #1DB446; font-weight: bold; }
        select:disabled { background-color: #f5f5f5; color: #aaa; cursor: not-allowed; }
        input:disabled { background-color: #f5f5f5; color: #aaa; cursor: not-allowed; }
        button { width: 100%; padding: 14px; background-color: #1DB446; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.3s; }
        button:active { background-color: #158f37; }
        button:disabled { background-color: #aaa; cursor: not-allowed; }
        #result-area { margin-top: 25px; display: none; }
        .result-box { background: #f9f9f9; border: 1.5px dashed #1DB446; padding: 15px; border-radius: 10px; white-space: pre-wrap; font-size: 15px; line-height: 1.6; }
        .copy-btn { background-color: #e91e63; margin-top: 10px; font-size: 16px; }
        .section-title { border-left: 4px solid #1DB446; padding-left: 10px; margin: 20px 0 10px 0; font-size: 16px; color: #1DB446; font-weight: bold; }
        .auto-fill-banner { background: #f0fff4; border: 1px solid #1DB446; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-size: 14px; color: #1DB446; display: none; }
        #planPreview { display: none; background: #f0fff4; border: 1px solid #1DB446; border-radius: 8px; padding: 12px 14px; margin-top: 8px; font-size: 13px; color: #333; line-height: 1.8; }
        #planPreview span { color: #1DB446; font-weight: bold; }
        #loadingMsg { text-align: center; color: #888; font-size: 14px; padding: 8px 0; display: none; }
        .error-msg { color: #e53935; font-size: 13px; margin-top: 6px; display: none; }
        .lead-yes-note { background: #fff8e1; border: 1px solid #f0a500; border-radius: 8px; padding: 10px 14px; margin-top: 8px; font-size: 13px; color: #8a6d00; display: none; }
        .save-status { text-align: center; font-size: 13px; color: #888; margin-top: 8px; display: none; }
        /* 🚀 新增：社區代碼查詢狀態提示 */
        #commHint { font-size: 13px; margin-top: 6px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>📝 申辦片語產生器</h2>

    <div class="auto-fill-banner" id="autoBanner">
        ✅ 優惠序號已自動帶入，請填寫其他資訊後按下合併。
    </div>

    <!-- 🚀 新增：社區代碼（最上方，先填這裡才會開放下方方案選擇）── -->
    <div class="section-title">社區代碼</div>
    <div class="input-group">
        <label>社區代碼</label>
        <input type="text" id="commCode" placeholder="例如：SH00050" autocomplete="off">
        <div id="commHint"></div>
    </div>
    <div class="input-group">
        <label>社區名稱（自動帶入，唯讀）</label>
        <input type="text" id="commName" readonly placeholder="輸入正確的社區代碼後自動帶出">
    </div>
    <!-- 🚀 新增：社區分群（自動帶入，來自社區主檔的個家分群，非下方方案選擇的社區分群） -->
    <div class="input-group">
        <label>社區分群（自動帶入，唯讀）</label>
        <input type="text" id="commGroup" readonly placeholder="輸入正確的社區代碼後自動帶出">
    </div>

    <!-- ── 方案選擇（連動，資料從 Sheet 載入）── -->
    <div class="section-title">方案選擇</div>
    <div id="loadingMsg">⏳ 載入方案資料中...</div>
    <div class="error-msg" id="loadError">❌ 方案資料載入失敗，請重新整理頁面。</div>

    <div class="input-group">
        <label>方案別</label>
        <select id="selPlan" onchange="onPlanChange()" disabled>
            <option value="">── 請先輸入社區代碼 ──</option>
        </select>
    </div>

    <div class="input-group" id="speedGroup">
        <label>新租速率</label>
        <select id="selSpeed" onchange="onSpeedChange()" disabled>
            <option value="">── 請先選方案別 ──</option>
        </select>
    </div>

    <div class="input-group" id="modGroup" style="display:none;">
        <label>MOD種類</label>
        <select id="selMod" onchange="onModChange()" disabled>
            <option value="">── 請選擇MOD種類 ──</option>
        </select>
    </div>

    <!-- 🚀 移除：原本的社區分群手動下拉已刪除，改由最上方自動查得的社區分群（communityInfo.group）
         自動判斷並帶入片語合併，詳見 autoFinalizeGroup() -->

    <!-- 選完後的預覽小卡 -->
    <div id="planPreview"></div>

    <!-- ── 申辦資訊 ── -->
    <div class="section-title">申辦資訊</div>

    <div class="input-group">
        <label>社區優惠碼（自動帶入）</label>
        <input type="text" id="planCouponCode" readonly placeholder="選完方案後自動填入">
    </div>

    <div class="input-group">
        <label>方案代碼（自動帶入）</label>
        <input type="text" id="planCode" readonly placeholder="選完方案後自動填入">
    </div>

    <div class="input-group">
        <label>優惠券號 (F000/POC券專屬)</label>
        <input type="text" id="couponCode" placeholder="請輸入領取的優惠券號">
    </div>

    <div class="input-group">
        <label>推廣人員編號</label>
        <input type="text" id="staffId" placeholder="例如：EMP12345">
    </div>

    <div class="input-group">
        <label>村里鄰推薦人姓名(簽約)</label>
        <input type="text" id="referrerName" placeholder="例如：世霖科技">
    </div>

    <div class="input-group">
        <label>前往門市名稱</label>
        <input type="text" id="storeName" placeholder="例如：新北永和門市">
    </div>

    <!-- 🚀 新增：是否為LINE商機通報案 -->
    <div class="input-group">
        <label>是否為 LINE 商機通報案</label>
        <select id="selLineLead" onchange="onLineLeadChange()">
            <option value="否">否</option>
            <option value="是">是</option>
        </select>
        <div class="lead-yes-note" id="leadYesNote">
            ℹ️ 選擇「是」後，片語的備註欄會自動加註「此為社區團隊送件 LINE商機通報案」，提醒門市留意。
        </div>
    </div>

    <div class="input-group">
        <label>備註(請門市協助備註)</label>
        <textarea id="extraNote" placeholder="例如：客戶指定要辦寬頻+市話" rows="3"
          style="width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; font-size:16px; box-sizing:border-box; resize:vertical; font-family:inherit; transition:border 0.3s;"
          onfocus="this.style.borderColor='#1DB446'" onblur="this.style.borderColor='#ddd'"></textarea>
    </div>

    <button id="generateBtn" onclick="generatePhrase()" disabled>✨ 開始合併片語</button>

    <div id="result-area">
        <div class="section-title">預覽結果</div>
        <div class="result-box" id="phraseResult"></div>
        <button class="copy-btn" onclick="copyPhrase()">📋 複製完整片語</button>
        <div class="save-status" id="saveStatus"></div>
    </div>
</div>

<script>
    // ── GAS API URL（與 index.html 相同）──
    const API_URL = "https://script.google.com/macros/s/AKfycbzSEopZ05o3bN-ROcPpLTbcrjXP9WgOmv6sDP4M8kbofRaJLarBOOJlCigEs-0GM0k/exec";
    const LIFF_ID  = "2010021235-m0rWdR4i";

    // 從 Sheet 載入的原始資料，格式：[{ plan, speed, mod, coupon, group, code, competing }, ...]
    let PLAN_ROWS = [];
    // 🚀 新增：依「是否為競爭社區」過濾後、實際餵給下拉選單使用的資料（每次社區代碼狀態改變都要重算）
    let VISIBLE_PLAN_ROWS = [];

    // 🚀 新增：競爭社區代碼清單（Set，比對用）
    let COMPETING_CODES = new Set();

    // 🚀 新增：頁面就緒狀態旗標
    let planDataLoaded = false;      // getPlanData 是否已成功回來
    let communityFound = false;      // 目前輸入的社區代碼是否查得到社區主檔資料
    let isCompetingCommunity = false; // 目前輸入的社區代碼是否存在於競爭社區清單
    let communityInfo = null;        // { found, code, name, address }

    // 🚀 新增：社區代碼查詢的 debounce 計時器與競態保護用序號
    let commDebounceTimer = null;
    let commLookupToken = 0;

    // 🚀 新增：登入使用者資訊（liff.getProfile）
    let CURRENT_USER = { displayName: "未知", userId: "" };

    // 🚀 新增：記住最後一次產生的片語各欄位，供複製時寫入記錄用
    let LAST_PHRASE_DATA = null;

    // ── 頁面初始化 ──
    // 方案資料載入(loadPlanData)、競爭社區清單載入(loadCompetingCodes)、LIFF 身份驗證三者「並行」，
    // 避免任何一個卡住/失敗連帶讓其他功能停在「載入中」。
    window.onload = async function() {
        // 1. URL 帶入序號
        const params = new URLSearchParams(window.location.search);
        const coupon = params.get('coupon');
        if (coupon) {
            const input = document.getElementById('couponCode');
            input.value = coupon;
            input.classList.add('auto-filled');
            document.getElementById('autoBanner').style.display = 'block';
        }

        // 2. 從 GAS 載入方案資料 —— 不等待其他流程，直接開始
        loadPlanData();

        // 3. 🚀 新增：從 GAS 載入競爭社區清單 —— 同樣不等待，並行進行
        loadCompetingCodes();

        // 4. 🚀 新增：綁定社區代碼輸入框事件
        document.getElementById('commCode').addEventListener('input', onCommCodeInput);

        // 5. 初始化 LIFF，取得使用者身份 —— 獨立進行，不阻擋其他流程
        try {
            await liff.init({ liffId: LIFF_ID });

            if (!liff.isLoggedIn()) {
                // liff.login() 會導向 LINE 登入頁，成功後重新導回本頁（帶原網址參數）
                liff.login({ redirectUri: window.location.href });
                return; // login 會重新導向，這裡先中止，不影響已經在跑的其他流程
            }

            const profile = await liff.getProfile();
            CURRENT_USER = { displayName: profile.displayName || "未知", userId: profile.userId || "" };

        } catch (err) {
            console.error("LIFF init/profile error:", err);
            // LIFF 初始化或取得個人資料失敗，記錄為「未知」使用者，不阻斷其他功能
            CURRENT_USER = { displayName: "未知(LIFF錯誤)", userId: "" };
        }
    };

    async function loadPlanData() {
        const loadingMsg = document.getElementById('loadingMsg');
        const loadError  = document.getElementById('loadError');
        loadingMsg.style.display = 'block';

        try {
            const res  = await fetch(`${API_URL}?action=getPlanData`, { redirect: 'follow' });
            const data = await res.json();

            if (!Array.isArray(data) || data.error) {
                throw new Error(data.error || "回傳格式錯誤");
            }

            PLAN_ROWS = data;
            planDataLoaded = true;
            updatePlanAvailability();

        } catch (err) {
            console.error("loadPlanData error:", err);
            loadError.style.display = 'block';
        } finally {
            loadingMsg.style.display = 'none';
        }
    }

    // 🚀 新增：載入競爭社區清單（CORE_SS_ID 內的「競爭社區清單」分頁，205 筆規模，一次撈回前端比對）
    async function loadCompetingCodes() {
        try {
            const res  = await fetch(`${API_URL}?action=getCompetingCodes`, { redirect: 'follow' });
            const data = await res.json();

            if (!Array.isArray(data)) {
                throw new Error(data && data.error ? data.error : "回傳格式錯誤");
            }

            COMPETING_CODES = new Set(data.map(c => String(c || "").trim().toUpperCase()));

            // 如果使用者在這支 API 回來之前就已經查完社區代碼，這裡要回頭補判斷一次「是否為競爭社區」
            if (communityFound && communityInfo) {
                isCompetingCommunity = COMPETING_CODES.has(String(communityInfo.code || "").trim().toUpperCase());
                updatePlanAvailability();
            }
        } catch (err) {
            // 競爭社區清單載入失敗不阻斷主流程，但特殊方案會直接視為「無法解鎖」，維持保守行為
            console.error("loadCompetingCodes error:", err);
        }
    }

    // 🚀 新增：社區代碼輸入框事件（debounce 後才查詢）
    function onCommCodeInput() {
        clearTimeout(commDebounceTimer);
        const raw = document.getElementById('commCode').value;

        // 使用者一開始改動輸入內容，就先讓下方方案鎖住、清空舊的查詢結果，避免誤用到上一個代碼的資料
        communityFound = false;
        isCompetingCommunity = false;
        communityInfo = null;
        const nameInput = document.getElementById('commName');
        nameInput.value = '';
        nameInput.classList.remove('readonly-filled');
        // 🚀 新增：社區分群欄位同步清空
        const groupInput = document.getElementById('commGroup');
        groupInput.value = '';
        groupInput.classList.remove('readonly-filled');
        updatePlanAvailability();

        if (!raw.trim()) {
            setCommHint('');
            return;
        }

        setCommHint('⏳ 查詢中...', 'loading');
        commDebounceTimer = setTimeout(() => lookupCommunity(raw), 500);
    }

    // 🚀 新增：呼叫 GAS 精確比對社區代碼，帶出社區名稱／地址，並判斷是否為競爭社區
    async function lookupCommunity(rawCode) {
        const code = rawCode.trim();
        if (!code) { setCommHint(''); return; }

        const myToken = ++commLookupToken;

        try {
            const res  = await fetch(`${API_URL}?action=getCommunityByCode&code=${encodeURIComponent(code)}`, { redirect: 'follow' });
            const data = await res.json();

            // 使用者在這次查詢還沒回來前又改了輸入內容，這次回應已經過期，直接丟棄
            if (myToken !== commLookupToken) return;

            if (data && data.found) {
                communityFound = true;
                // 🚀 分群文字直接使用社區主檔查回來的原始格式（例如「A (70戶以上)」），不額外加工，
                // 畫面顯示、片語合併、AB分群比對（一律用 getGroupABPrefix 取開頭字母）都吃這個值
                communityInfo = data;
                isCompetingCommunity = COMPETING_CODES.has(String(data.code || "").trim().toUpperCase());

                const nameInput = document.getElementById('commName');
                nameInput.value = data.name;
                nameInput.classList.add('readonly-filled');

                // 社區分群一併帶出（來自社區主檔的個家分群，跟下方方案選擇裡的社區分群雖然是不同資料來源，
                // 🚀 但現在會用來限制④能選的方案：非競爭社區只放行跟這裡一致的AB分群，競爭社區則不限制）
                const groupInput = document.getElementById('commGroup');
                groupInput.value = data.group || '無';
                groupInput.classList.add('readonly-filled');

                setCommHint(isCompetingCommunity ? '✅ 已查得社區，屬競爭社區，開放特殊方案' : '✅ 已查得社區', 'ok');
            } else {
                communityFound = false;
                isCompetingCommunity = false;
                communityInfo = null;
                setCommHint('❌ 查無此社區代碼，此片語功能不支援此社區', 'error');
            }
        } catch (err) {
            if (myToken !== commLookupToken) return;
            console.error("lookupCommunity error:", err);
            communityFound = false;
            isCompetingCommunity = false;
            communityInfo = null;
            setCommHint('⚠️ 查詢失敗，請確認網路後重新輸入一次社區代碼', 'error');
        } finally {
            if (myToken === commLookupToken) updatePlanAvailability();
        }
    }

    function setCommHint(text, type) {
        const el = document.getElementById('commHint');
        el.textContent = text;
        el.style.display = text ? 'block' : 'none';
        el.style.color = type === 'error' ? '#e53935' : (type === 'ok' ? '#1DB446' : '#888');
    }

    // 🚀 新增：社區代碼／競爭社區狀態一有變動，就統一由這裡決定①方案別能不能選、選項有哪些，
    // 並強制清空②③④與已產生的片語欄位，避免殘留不該存在的組合。
    function updatePlanAvailability() {
        const selPlan = document.getElementById('selPlan');
        const ready = planDataLoaded && communityFound;

        resetCascadeBelowPlan();

        if (!ready) {
            selPlan.innerHTML = '<option value="">' +
                (!planDataLoaded ? '── 載入中 ──' : '── 請先輸入有效的社區代碼 ──') +
                '</option>';
            selPlan.disabled = true;
            refreshGenerateButton();
            return;
        }

        // 🚀 新增：社區若不屬於競爭社區，且社區主檔查得到明確的AB分群，方案列表要限制成只放行同一個AB分群
        // （或該列本身沒有AB分群概念，例如「無上網MOD」）；競爭社區、或社區主檔AB分群不明確時，不做AB限制，A/B都放行。
        const communityAB = isCompetingCommunity ? "" : getGroupABPrefix(communityInfo && communityInfo.group);

        VISIBLE_PLAN_ROWS = PLAN_ROWS.filter(r => {
            // 既有的競爭社區旗標判斷
            if (r.competing && !isCompetingCommunity) return false;

            // 🚀 新增：AB 分群限制
            if (r.group && communityAB) {
                const rowAB = getGroupABPrefix(r.group);
                if (rowAB && rowAB !== communityAB) return false;
            }

            return true;
        });
        buildPlanSelect();
        refreshGenerateButton();
    }

    // 從分群文字取出開頭的 A 或 B（不做整串文字比對，避免「A群 (70戶以上)」跟「A (70戶以上)」
    // 這種來源不同、格式略有差異的文字因為比對不到而誤判）。查不到明確AB（例如「無」、「不分群」、空字串）回傳空字串代表無法判斷。
    function getGroupABPrefix(groupText) {
        const s = String(groupText || "").trim();
        if (s.startsWith("A")) return "A";
        if (s.startsWith("B")) return "B";
        return "";
    }

    // 🚀 新增：記錄最後一次 finalizeSelection 比對到的方案組合本身有沒有分群概念
    // （沒有分群概念的組合，例如部分「無上網MOD」，片語裡不顯示社區分群這行）
    let LAST_MATCH_HAS_GROUP = false;

    // 只重置②③與方案預覽小卡，不動①方案別本身（①由 updatePlanAvailability 統一處理）
    // 🚀 原本的④社區分群手動下拉已移除，改由 autoFinalizeGroup() 用最上方查得的社區AB分群自動判斷
    function resetCascadeBelowPlan() {
        const selSpeed = document.getElementById('selSpeed');
        const selMod = document.getElementById('selMod');

        selSpeed.innerHTML = '<option value="">── 請先選方案別 ──</option>';
        selSpeed.disabled = true;
        selMod.innerHTML = '<option value="">── 請選擇MOD種類 ──</option>';
        selMod.disabled = true;

        document.getElementById('modGroup').style.display = 'none';
        document.getElementById('speedGroup').style.display = 'block';

        clearPlanResult();
    }

    // 集中控制「開始合併片語」按鈕是否可按
    function refreshGenerateButton() {
        document.getElementById('generateBtn').disabled = !(planDataLoaded && communityFound);
    }

    // 建立「方案別」下拉（去重；資料來源改為 VISIBLE_PLAN_ROWS，已依競爭社區/AB分群狀態過濾過）
    function buildPlanSelect() {
        const plans = [...new Set(VISIBLE_PLAN_ROWS.map(r => r.plan))];
        const sel = document.getElementById('selPlan');
        sel.innerHTML = '<option value="">── 請選擇方案別 ──</option>';
        plans.forEach(p => {
            const opt = document.createElement('option');
            opt.value = opt.textContent = p;
            sel.appendChild(opt);
        });
        sel.disabled = false;
    }

    // ── 連動邏輯 ──
    function onPlanChange() {
        const plan = document.getElementById('selPlan').value;
        const selSpeed = document.getElementById('selSpeed');
        const selMod = document.getElementById('selMod');
        const modGroup = document.getElementById('modGroup');
        const speedGroup = document.getElementById('speedGroup');

        selSpeed.innerHTML = '<option value="">── 請選擇速率 ──</option>';
        selMod.innerHTML = '<option value="">── 請選擇MOD種類 ──</option>';
        selMod.disabled = true;
        modGroup.style.display = 'none';
        speedGroup.style.display = 'block';
        clearPlanResult();

        if (!plan) { selSpeed.disabled = true; return; }

        const speeds = [...new Set(
            VISIBLE_PLAN_ROWS.filter(r => r.plan === plan).map(r => r.speed)
        )];

        // 若此方案別底下「所有」速率都是空字串（例如「無上網MOD」），
        // 代表這個方案別本來就沒有速率概念，跳過速率層，直接往下判斷MOD層。
        const hasRealSpeed = speeds.some(s => s !== "");

        if (!hasRealSpeed) {
            speedGroup.style.display = 'none';
            selSpeed.disabled = true;
            proceedAfterSpeed(plan, "");
            return;
        }

        speeds.forEach(s => {
            const opt = document.createElement('option');
            opt.value = opt.textContent = s;
            selSpeed.appendChild(opt);
        });
        selSpeed.disabled = false;
    }

    function onSpeedChange() {
        const plan  = document.getElementById('selPlan').value;
        const speed = document.getElementById('selSpeed').value;
        clearPlanResult();

        if (!speed) {
            document.getElementById('modGroup').style.display = 'none';
            return;
        }
        proceedAfterSpeed(plan, speed);
    }

    // 共用邏輯，速率確定後（不論是使用者選的，還是因無速率而自動帶入空字串），
    // 判斷此 方案別+速率 組合下是否有 MOD 選項，決定顯示 MOD 下拉、或直接自動完成分群比對。
    function proceedAfterSpeed(plan, speed) {
        const selMod = document.getElementById('selMod');
        const modGroup = document.getElementById('modGroup');

        selMod.innerHTML = '<option value="">── 請選擇MOD種類 ──</option>';

        const matchedRows = VISIBLE_PLAN_ROWS.filter(r => r.plan === plan && r.speed === speed);
        const modOptions = [...new Set(matchedRows.map(r => r.mod).filter(m => m !== ""))];

        if (modOptions.length > 0) {
            // 有 MOD 選項：顯示 MOD 下拉，選完 MOD 才自動完成分群比對
            modGroup.style.display = 'block';
            modOptions.forEach(m => {
                const opt = document.createElement('option');
                opt.value = opt.textContent = m;
                selMod.appendChild(opt);
            });
            selMod.disabled = false;
        } else {
            // 無 MOD 選項：跳過這一層，直接用空字串自動完成分群比對
            modGroup.style.display = 'none';
            selMod.disabled = true;
            autoFinalizeGroup(plan, speed, "");
        }
    }

    // MOD種類選擇後，自動完成分群比對
    // 🚀 原本這裡是建立社區分群下拉讓使用者手動選，現在改成呼叫 autoFinalizeGroup 自動判斷
    function onModChange() {
        const plan  = document.getElementById('selPlan').value;
        const speed = document.getElementById('selSpeed').disabled ? "" : document.getElementById('selSpeed').value;
        const mod   = document.getElementById('selMod').value;

        clearPlanResult();

        if (!mod) { return; }
        autoFinalizeGroup(plan, speed, mod);
    }

    // 🚀 新增：取代原本的④社區分群手動下拉。①~③選定後，VISIBLE_PLAN_ROWS 已經依社區自己的AB分群
    // （或競爭社區不限制）篩選過，正常情況下這個組合底下只會剩一種分群可能，不需要使用者再選一次。
    function autoFinalizeGroup(plan, speed, mod) {
        const matchedRows = VISIBLE_PLAN_ROWS.filter(r => r.plan === plan && r.speed === speed && r.mod === mod);
        const realGroups = [...new Set(matchedRows.map(r => r.group).filter(g => g !== ""))];

        if (realGroups.length === 0) {
            // 這個組合本來就沒有分群概念（例如部分「無上網MOD」），直接用空字串完成比對
            finalizeSelection(plan, speed, mod, "");
            return;
        }

        if (realGroups.length === 1) {
            // 最常見情況：已經被AB分群篩選到只剩一種可能，直接採用，不需要使用者再點一次
            finalizeSelection(plan, speed, mod, realGroups[0]);
            return;
        }

        // 篩選後仍有多種分群可能：目前只會發生在「競爭社區」選到一般（非競業旗標）方案的情況，
        // 因為競爭社區不限制AB、A群B群都會留著。這裡用社區自己查到的AB去挑對應那一筆；
        // 若社區主檔本身查不到明確AB（顯示「無」），退而求其次採用第一筆，維持系統可用、不卡死使用者。
        const communityAB = getGroupABPrefix(communityInfo && communityInfo.group);
        const matched = realGroups.find(g => getGroupABPrefix(g) === communityAB);
        finalizeSelection(plan, speed, mod, matched || realGroups[0]);
    }

    // 共用邏輯，比對出最終的社區優惠碼/方案代碼，並顯示確認小卡。
    // 🚀 分群顯示改用最上方社區代碼查詢得到的 communityInfo.group（例如「A (70戶以上)」），
    // 不再顯示方案選單E欄的原始文字（例如「A群 (70戶以上)」或「不分群」）——
    // 比對用的是傳進來的原始 group 文字（跟 Sheet 一致），顯示用的一律是社區主檔查到的文字。
    function finalizeSelection(plan, speed, mod, group) {
        const match = VISIBLE_PLAN_ROWS.find(r => r.plan === plan && r.speed === speed && r.mod === mod && r.group === group);
        if (!match) { clearPlanResult(); return; }

        LAST_MATCH_HAS_GROUP = group !== "";
        const displayGroup = LAST_MATCH_HAS_GROUP ? (communityInfo.group || "無") : "";

        const couponInput = document.getElementById('planCouponCode');
        const codeInput   = document.getElementById('planCode');
        couponInput.value = match.coupon;
        codeInput.value   = match.code;
        couponInput.classList.add('readonly-filled');
        codeInput.classList.add('readonly-filled');

        const preview = document.getElementById('planPreview');
        preview.style.display = 'block';
        preview.innerHTML = `
            📋 方案確認<br>
            ・方案別：<span>${plan}</span><br>
            ${speed ? '・速率：<span>' + speed + '</span><br>' : ''}
            ${mod ? '・MOD種類：<span>' + mod + '</span><br>' : ''}
            ${displayGroup ? '・分群：<span>' + displayGroup + '</span><br>' : ''}
            ・社區優惠碼：<span>${match.coupon}</span><br>
            ・方案代碼：<span>${match.code}</span>
        `;
    }

    function clearPlanResult() {
        LAST_MATCH_HAS_GROUP = false;
        ['planCouponCode', 'planCode'].forEach(id => {
            const el = document.getElementById(id);
            el.value = '';
            el.classList.remove('readonly-filled');
        });
        const preview = document.getElementById('planPreview');
        preview.style.display = 'none';
        preview.innerHTML = '';
    }

    // 🚀 新增：商機通報案下拉切換提示
    function onLineLeadChange() {
        const isYes = document.getElementById('selLineLead').value === '是';
        document.getElementById('leadYesNote').style.display = isYes ? 'block' : 'none';
    }

    // 🚀 新增：企業戶名單（推薦人欄位包含以下任一關鍵字，視為企業戶）
    const ENTERPRISE_KEYWORDS = ["世霖科技", "陳盈君"];

    // 🚀 新增：依「方案別」名稱判斷優惠序號前綴（含 POC 字樣→F00C，否則→F000）
    function getCouponPrefix(planName) {
        return (planName && planName.includes("POC")) ? "F00C" : "F000";
    }

    function getReferrerTypeTag(referrerNameValue) {
        if (!referrerNameValue) return "";
        const isEnterprise = ENTERPRISE_KEYWORDS.some(kw => referrerNameValue.includes(kw));
        return isEnterprise ? "DC5G企業戶" : "DC5F個人戶";
    }

    // ── 產生片語 ──
    function generatePhrase() {
        // 🚀 防呆：理論上按鈕在未查得社區代碼前是 disabled 狀態，這裡多一層保險，避免例外情況下仍被觸發
        if (!communityFound || !communityInfo) {
            alert('請先輸入有效的社區代碼，系統查得社區名稱後才能產生片語。');
            return;
        }

        const plan       = document.getElementById('selPlan').value || "(未選)";
        const couponPrefix = getCouponPrefix(plan);
        const speedSelect = document.getElementById('selSpeed');
        const speed       = speedSelect.disabled ? "" : speedSelect.value; // 無速率選項時視為空字串，不顯示在片語
        const modSelect  = document.getElementById('selMod');
        const mod        = modSelect.disabled ? "" : modSelect.value; // 無MOD選項時視為空字串，不顯示在片語
        // 🚀 社區分群改用最上方自動查得的社區分群（communityInfo.group），是否顯示這行看
        // 最後一次自動比對到的方案組合本身有沒有分群概念（LAST_MATCH_HAS_GROUP，於 finalizeSelection 設定）
        const group = LAST_MATCH_HAS_GROUP ? (communityInfo.group || "無") : "";
        const planCoupon = document.getElementById('planCouponCode').value || "(未填)";
        const planCode   = document.getElementById('planCode').value || "(未填)";
        // 🚀 社區名稱／識別碼改為由社區代碼查詢結果組成，不再手動輸入
        const comm       = `${communityInfo.name}／${communityInfo.code}`;
        const coupon     = document.getElementById('couponCode').value || "(未填)";
        const staff      = document.getElementById('staffId').value || "(未填)";
        const referrerName = document.getElementById('referrerName').value || "(未填)";
        const referrerType = getReferrerTypeTag(document.getElementById('referrerName').value.trim());
        const store      = document.getElementById('storeName').value || "(未填)";
        const isLineLead = document.getElementById('selLineLead').value;
        const noteRaw    = document.getElementById('extraNote').value.trim();

        // 備註組合邏輯：
        // 1. 「此為社區團隊送件」一律固定出現，不受「是否為LINE商機通報案」影響
        // 2. 選「是」時，額外疊加「LINE商機通報案」字樣
        // 3. 推薦人有填時，疊加「推薦人：姓名」與戶別標記
        // 4. 使用者自填內容疊加在最後
        const noteParts = [];
        noteParts.push(
            isLineLead === '是'
                ? "此為社區團隊送件 LINE商機通報案"
                : "此為社區團隊送件"
        );
        if (referrerType) {
            noteParts.push(`推薦人：${referrerName}`);
            noteParts.push(referrerType);
        }
        if (noteRaw) {
            noteParts.push(noteRaw);
        }
        const note = noteParts.join('；');

        const phraseHTML = `親愛的客戶您好，感謝您的申辦 🙌 為加速門市作業，請您前往辦理時，提供以下資料給門市人員，謝謝：

📍 溫馨提醒（避免白跑一趟）
・請攜帶身分證及第二證件（如健保卡或駕照）

📌 申辦資訊
<span style="background-color:yellow; color: red;">
🚨【重要】請客戶務必攜帶: 身分證及第二證件（如健保卡或駕照)、競業帳單(若要申辦競業方案使用)
🚨【重要】請於電路資料區塊鍵入社區識別碼
🚨【重要】受理Step1: 社區名稱／社區識別碼：${comm} </span>

・申辦內容：${plan}${speed ? ' ' + speed : ''}${mod ? '\n・MOD種類：' + mod : ''}${group ? '\n・社區分群：' + group : ''}
・社區優惠碼：${planCoupon}
・方案代碼：${planCode}
・社區代碼／社區名稱：${communityInfo.code}／${communityInfo.name}
・社區優惠專屬優惠序號：${couponPrefix}（${coupon}）
・推廣人員編：${staff}
・推薦人姓名(村里鄰簽約)：${referrerName}${referrerType ? ' (' + referrerType + ')' : ''}
・類型：社區團隊推廣案(請門市備註)
・前往門市名稱：${store}${note ? '\n・備註(請門市協助備註)：' + note : ''}

😊 建議可先確認門市營業時間：<a href="https://reurl.cc/N2EK5x" target="_blank" style="color: #1DB446; text-decoration: underline;">https://reurl.cc/N2EK5x</a>`;

        document.getElementById('phraseResult').innerHTML = phraseHTML;
        document.getElementById('result-area').style.display = 'block';
        document.getElementById('saveStatus').style.display = 'none';
        document.getElementById('saveStatus').textContent = '';

        // 記住這次的結構化資料，供複製時寫入 Sheet
        LAST_PHRASE_DATA = {
            plan, speed, mod, group, planCoupon, planCode,
            commId: comm, couponCode: coupon, staffId: staff, referrerName, referrerType, storeName: store,
            isLineLead, note,
            isCompeting: isCompetingCommunity // 🚀 新增：這次產生片語當下，社區代碼是否屬於競爭社區清單
        };

        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    // ── 複製片語（含 fallback）＋ 寫入使用記錄 ──
    function copyPhrase() {
        const text = document.getElementById('phraseResult').innerText;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text)
                .then(() => { alert('片語已複製到剪貼簿！\n(貼上至 LINE 時網址會自動轉為連結)'); logUsage(); })
                .catch(() => { fallbackCopy(text); logUsage(); });
        } else {
            fallbackCopy(text);
            logUsage();
        }
    }

    function fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.top = '0';
        ta.style.left = '0';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try {
            document.execCommand('copy');
            alert('片語已複製到剪貼簿！\n(貼上至 LINE 時網址會自動轉為連結)');
        } catch (err) {
            alert('自動複製失敗，請手動長按文字區域複製。');
        }
        document.body.removeChild(ta);
    }

    // 🚀 新增：複製成功後，將本次片語使用資訊寫入 Sheet（不阻塞 UI）
    async function logUsage() {
        if (!LAST_PHRASE_DATA) return;

        const statusEl = document.getElementById('saveStatus');
        statusEl.style.display = 'block';
        statusEl.textContent = '⏳ 記錄使用資訊中...';

        const payload = {
            action: 'logPhraseUsage',
            payload: {
                userName: CURRENT_USER.displayName,
                userId: CURRENT_USER.userId,
                ...LAST_PHRASE_DATA
            }
        };

        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            statusEl.textContent = data.success ? '✅ 已記錄使用資訊' : '⚠️ 記錄失敗，但不影響片語使用';
        } catch (err) {
            console.error("logUsage error:", err);
            statusEl.textContent = '⚠️ 記錄失敗，但不影響片語使用';
        }
    }
</script>
